# 网站的外部检查：每天一次，也可以在 Actions 页面手动运行。
# 检查证书剩余天数（少于 21 天算失败）、跳转、首页和安全响应头、公开文件、404。
# 失败时 GitHub 会给维护者发邮件，服务器上不需要装发信程序。
# 域名还没解析到服务器之前，自动跳过。
# 注意：公开仓库 60 天没有任何活动时，GitHub 会停用定时工作流，需要在 Actions 页面重新启用。
name: site-monitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 外部检查
        run: |
          set -euo pipefail
          site="https://www.qunxingmath.org"
          if ! getent hosts www.qunxingmath.org >/dev/null; then
            echo "::notice::www.qunxingmath.org 还没有解析，跳过检查。"
            exit 0
          fi
          fail=0
          err() { echo "::error::$1"; fail=1; }

          # 1. 证书剩余天数
          for host in www.qunxingmath.org qunxingmath.org; do
            end=$(openssl s_client -servername "$host" -connect "$host:443" </dev/null 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
            if [ -z "$end" ]; then
              err "拿不到 $host 的证书。"
              continue
            fi
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$host 的证书还剩 $days 天。"
            [ "$days" -ge 21 ] || err "$host 的证书只剩 $days 天，自动续期可能出了问题。"
          done

          # 2. 跳转：都应该 301 到 https://www
          for url in "http://qunxingmath.org/" "http://www.qunxingmath.org/" "https://qunxingmath.org/"; do
            got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$url" || true)
            echo "$url → $got"
            [ "$got" = "301 $site/" ] || err "$url 应该 301 到 $site/，实际是：$got"
          done

          # 3. 首页和安全响应头（curl 默认校验证书链）
          headers=$(curl -s -D - -o /dev/null --max-time 20 "$site/" || true)
          code=$(awk 'NR==1 {print $2}' <<<"$headers")
          echo "首页返回 $code。"
          [ "$code" = "200" ] || err "首页返回 $code，不是 200。"
          for h in strict-transport-security content-security-policy x-content-type-options referrer-policy; do
            grep -qi "^$h:" <<<"$headers" || err "首页缺少响应头 $h。"
          done

          # 4. 公开文件
          for path in /llms.txt /robots.txt /.well-known/security.txt; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$site$path" || true)
            echo "$path 返回 $c。"
            [ "$c" = "200" ] || err "$path 返回 $c，不是 200。"
          done
          sec=$(curl -s --max-time 20 "$site/.well-known/security.txt" || true)
          grep -q '^Contact: ' <<<"$sec" || err "security.txt 里没有 Contact。"

          # 5. 不存在的页面
          c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$site/no-such-page-site-monitor" || true)
          echo "不存在的页面返回 $c。"
          [ "$c" = "404" ] || err "不存在的页面返回 $c，不是 404。"

          exit "$fail"

      - name: Public evidence data
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          site = "https://www.qunxingmath.org/api/v1/"
          documents = {}
          for name in ("index.json", "evidence.json", "vocab.json"):
              with urlopen(site + name, timeout=20) as response:
                  documents[name] = json.load(response)
          index, evidence, vocab = (documents[name] for name in ("index.json", "evidence.json", "vocab.json"))
          assert index["schema"] == "qunxing.site-api/1"
          assert evidence["schema"] == "qunxing.site-evidence/1"
          assert vocab["schema"] == "qunxing.vocab/1"
          assert index["source"] == evidence["source"], "API and evidence use different snapshots"
          assert evidence["count"] == len(evidence["items"]), "Evidence count differs from its index"
          print("source.commit=" + index["source"]["commit"])
          print("evidence.count=" + str(evidence["count"]))
          PY
