name: 问题反馈 / Bug report
description: 软件、网站或数据流程出了错 / Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要贴密钥、令牌或个人信息。安全问题请按 SECURITY.md 私下报告。
        Do not paste secrets or personal data. Report security issues privately.
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 桌面端在"设置 → 关于"里能看到版本号；网站问题请写页面地址。
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统 / OS
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际的结果 / Actual result
      description: 可以附截图或日志。附之前先删掉密钥和个人信息。
    validations:
      required: true
