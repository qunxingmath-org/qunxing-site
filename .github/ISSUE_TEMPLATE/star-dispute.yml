name: 点亮或熄灭异议 / Star dispute
description: 对某颗星的点亮、熄灭、撤销或先后顺序有异议
title: "[点亮异议] QX-S-"
body:
  - type: markdown
    attributes:
      value: |
        我们会在 7 天内答复（见《群星研究守则》第 10 节）。
        We aim to reply within 7 days.
  - type: input
    id: star
    attributes:
      label: 星星编号 / Star ID
      placeholder: QX-S-…
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 异议类型 / Type
      options:
        - 不该点亮 / Should not be lit
        - 不该熄灭或撤销 / Should not be revoked
        - 先后顺序或署名 / Priority or attribution
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 理由和材料 / Reasons and evidence
    validations:
      required: true
