name: 建议 / Feature request
description: 新功能或改进 / Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的想法 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法 / Alternatives considered
