name: 题面异议 / Problem statement dispute
description: 题卡的题面（自然语言或 Lean）有错、有歧义，或与出处不符
title: "[题面异议] QX-P-"
body:
  - type: markdown
    attributes:
      value: |
        维护者受理后，题卡会标"有异议"，并暂停新的点亮，直到处理完（见《群星研究守则》第 10 节）。
        Once accepted by a maintainer, the card is marked as disputed and new lightings pause until it is resolved.
  - type: input
    id: card
    attributes:
      label: 题号 / Card ID
      placeholder: QX-P-000142
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: 哪一部分 / Which part
      options:
        - 自然语言题面 / Natural-language statement
        - Lean 题面 / Lean statement
        - 出处或状态 / Source or status
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 具体位置 / Exact location
      description: 引用原文，或者写出 Lean 文件和行号。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 问题和依据 / What is wrong and why
      description: 附上文献、链接或反例。
    validations:
      required: true
