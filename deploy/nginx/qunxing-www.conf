# 群星网站（www）的 nginx 配置。放在 /etc/nginx/conf.d/ 或 sites-available/（会被 http {} 包含）。
# - 只管 qunxingmath.org 和 www.qunxingmath.org。中转的配置放在别的文件里，不要用 qunxingmath.org 的任何主机名。
# - 证书路径按 ACME 客户端的实际位置修改，或者把证书链接到 /etc/qunxing/tls/www/。
# - nginx 1.25.1 及以上可以把 "listen 443 ssl http2" 改成 "listen 443 ssl" 加一行 "http2 on;"。
# - 服务器内核关闭了 IPv6 的话，删掉所有 "listen [::]" 的行，否则 nginx 起不来。
# - 限额按数据系统规格 9.1：每个 IP 20 个连接，每秒 10 个请求，突发 50。

limit_conn_zone $binary_remote_addr zone=qx_www_conn:10m;
limit_req_zone $binary_remote_addr zone=qx_www_req:10m rate=10r/s;

# 各路径的静态缓存策略，保留 HTML 的重新验证要求。
map "$uri:$sent_http_content_type" $qx_www_cache_control {
    default         "";
    ~^/assets/      "max-age=86400";
    ~:text/html     "max-age=300, must-revalidate";
}

# HTTP：只处理 ACME 验证，其余一律跳到 https://www
server {
    listen 80;
    listen [::]:80;
    server_name qunxingmath.org www.qunxingmath.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://www.qunxingmath.org$request_uri;
    }
}

# 根域名的 HTTPS：跳到 www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qunxingmath.org;

    ssl_certificate /etc/qunxing/tls/www/fullchain.pem;
    ssl_certificate_key /etc/qunxing/tls/www/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=86400" always;
    return 301 https://www.qunxingmath.org$request_uri;
}

# 静态站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qunxingmath.org;

    ssl_certificate /etc/qunxing/tls/www/fullchain.pem;
    ssl_certificate_key /etc/qunxing/tls/www/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/qunxing/www/current;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/markdown application/json image/svg+xml;
    gzip_static on;

    limit_conn qx_www_conn 20;
    limit_req zone=qx_www_req burst=50 nodelay;
    limit_conn_status 429;
    limit_req_status 429;

    # HSTS 先用 1 天，稳定后改成一年（31536000），暂不加 preload
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $qx_www_cache_control;

    location ^~ /api/v1/ {
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "max-age=300, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location = /llms.txt {
        default_type text/plain;
    }

    error_page 404 /404.html;
}
